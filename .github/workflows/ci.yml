name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.301
      - name: Validate
        run: claude plugin validate .
      - name: Test
        run: claude plugin test .
      - name: Changelog
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          grep -q "^## $version " CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          pipx run --spec commitizen==4.19.2 cz check --rev-range "$RANGE"
          pipx run --spec commitizen==4.19.2 cz check --message "$TITLE"
