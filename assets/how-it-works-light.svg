<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="880" height="280" viewBox="0 0 880 280" role="img" aria-label="While Claude works on your task, you copy text with Ctrl+C and add ideas and comments; they go to a queue instead of to Claude. When it is done you answer it as usual, and /aside plan hands the queue over as steps, which Claude sums up after the last one.">
  <style>
    .lab { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .t { font: 500 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .s { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .m { font: 500 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .k { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#818b98"/>
    </marker>
  </defs>

  <text x="0" y="75" class="lab">Claude</text>
  <text x="0" y="165" class="lab">You</text>
  <text x="0" y="235" class="lab">Queue</text>
  <line x1="92" y1="70" x2="880" y2="70" stroke="#d1d9e0" stroke-dasharray="2 4"/>
  <line x1="92" y1="160" x2="880" y2="160" stroke="#d1d9e0" stroke-dasharray="2 4"/>

  <rect x="92" y="56" width="420" height="28" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="106" y="75" class="t">works on your task, undisturbed</text>
  <rect x="524" y="56" width="56" height="28" rx="14" fill="#f6f8fa" stroke="#d1d9e0"/><text x="552" y="75" class="t" text-anchor="middle">done</text>

  <rect x="96" y="146" width="96" height="28" rx="14" fill="#fff8c5" stroke="#d4a72c"/><text x="144" y="165" class="m" text-anchor="middle">+ idea</text>
  <text x="240" y="136" class="s" text-anchor="middle">copy first</text>
  <rect x="208" y="147" width="64" height="26" rx="5" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <rect x="209" y="168" width="62" height="4" rx="2" fill="#d1d9e0"/>
  <text x="240" y="164" class="k" text-anchor="middle">Ctrl+C</text>
  <path d="M274 160 H284" stroke="#9a6700" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="288" y="146" width="112" height="28" rx="14" fill="#fff8c5" stroke="#d4a72c"/><text x="344" y="165" class="m" text-anchor="middle">+? comment</text>
  <rect x="416" y="146" width="104" height="28" rx="14" fill="#fff8c5" stroke="#d4a72c"/><text x="468" y="165" class="m" text-anchor="middle">+! change</text>

  <path d="M144 176 V212" stroke="#d4a72c" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M344 176 V212" stroke="#d4a72c" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M468 176 V212" stroke="#d4a72c" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="92" y="216" width="440" height="28" rx="6" fill="#f6f8fa" stroke="#d4a72c" stroke-dasharray="4 3"/>
  <text x="106" y="235" class="s">waits here with what you copied, Claude does not see it</text>

  <rect x="548" y="146" width="52" height="28" rx="14" fill="#f6f8fa" stroke="#d1d9e0"/><text x="574" y="165" class="t" text-anchor="middle">reply</text>
  <path d="M574 144 V90" stroke="#818b98" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <rect x="616" y="146" width="112" height="28" rx="14" fill="#dafbe1" stroke="#4ac26b"/><text x="672" y="165" class="m" text-anchor="middle">/aside plan</text>
  <path d="M536 230 H672 V180" stroke="#4ac26b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M672 144 V90" stroke="#4ac26b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <rect x="624" y="56" width="72" height="28" rx="14" fill="#dafbe1" stroke="#4ac26b"/><text x="660" y="75" class="t" text-anchor="middle">step 1</text>
  <rect x="704" y="56" width="72" height="28" rx="14" fill="#dafbe1" stroke="#4ac26b"/><text x="740" y="75" class="t" text-anchor="middle">step 2</text>
  <rect x="784" y="56" width="96" height="28" rx="14" fill="#dafbe1" stroke="#4ac26b"/><text x="832" y="75" class="t" text-anchor="middle">summary</text>

  <text x="574" y="272" class="s" text-anchor="middle">you answer as usual</text>
  <text x="792" y="272" class="s" text-anchor="middle">then hand the queue over</text>
</svg>
