<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="880" height="270" viewBox="0 0 880 270" role="img" aria-label="While Claude works on your task, your ideas and comments go to a queue instead of to Claude. When it is done you answer it as usual, and /aside plan hands the queue over as steps.">
  <style>
    .lab { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .t { font: 500 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .s { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .m { font: 500 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#818b98"/>
    </marker>
  </defs>

  <text x="0" y="65" class="lab">Claude</text>
  <text x="0" y="155" class="lab">You</text>
  <text x="0" y="225" class="lab">Queue</text>
  <line x1="92" y1="60" x2="880" y2="60" stroke="#d1d9e0" stroke-dasharray="2 4"/>
  <line x1="92" y1="150" x2="880" y2="150" stroke="#d1d9e0" stroke-dasharray="2 4"/>

  <rect x="92" y="46" width="420" height="28" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="106" y="65" class="t">works on your task, undisturbed</text>
  <rect x="524" y="46" width="56" height="28" rx="14.0" fill="#f6f8fa" stroke="#d1d9e0"/><text x="552.0" y="65.0" class="t" text-anchor="middle">done</text>

  <rect x="112" y="136" width="104" height="28" rx="14.0" fill="#fff8c5" stroke="#d4a72c"/><text x="164.0" y="155.0" class="m" text-anchor="middle">+ idea</text>
  <rect x="240" y="136" width="120" height="28" rx="14.0" fill="#fff8c5" stroke="#d4a72c"/><text x="300.0" y="155.0" class="m" text-anchor="middle">+? comment</text>
  <rect x="384" y="136" width="112" height="28" rx="14.0" fill="#fff8c5" stroke="#d4a72c"/><text x="440.0" y="155.0" class="m" text-anchor="middle">+! change</text>

  <path d="M164 166 V202" stroke="#d4a72c" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M300 166 V202" stroke="#d4a72c" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M440 166 V202" stroke="#d4a72c" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="92" y="206" width="420" height="28" rx="6" fill="#f6f8fa" stroke="#d4a72c" stroke-dasharray="4 3"/>
  <text x="106" y="225" class="s">waits here, Claude does not see it</text>

  <rect x="528" y="136" width="52" height="28" rx="14.0" fill="#f6f8fa" stroke="#d1d9e0"/><text x="554.0" y="155.0" class="t" text-anchor="middle">reply</text>
  <path d="M554 134 V80" stroke="#818b98" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <rect x="600" y="136" width="112" height="28" rx="14.0" fill="#dafbe1" stroke="#4ac26b"/><text x="656.0" y="155.0" class="m" text-anchor="middle">/aside plan</text>
  <path d="M516 220 H656 V170" stroke="#4ac26b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M656 134 V80" stroke="#4ac26b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <rect x="604" y="46" width="82" height="28" rx="14.0" fill="#dafbe1" stroke="#4ac26b"/><text x="645.0" y="65.0" class="t" text-anchor="middle">step 1</text>
  <rect x="694" y="46" width="82" height="28" rx="14.0" fill="#dafbe1" stroke="#4ac26b"/><text x="735.0" y="65.0" class="t" text-anchor="middle">step 2</text>
  <rect x="784" y="46" width="82" height="28" rx="14.0" fill="#dafbe1" stroke="#4ac26b"/><text x="825.0" y="65.0" class="t" text-anchor="middle">step 3</text>

  <text x="554" y="262" class="s" text-anchor="middle">you answer as usual</text>
  <text x="786" y="262" class="s" text-anchor="middle">then hand the queue over</text>
</svg>
