<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="880" height="232" viewBox="0 0 880 232" role="img" aria-label="A step that asks you waits. Step 2 asks for a yes, and the line above the prompt says waits for you. Your answer, yes, build it, goes to that same step, which builds it while the line says step 2 running. Claude's reply to it ends step 2, and step 3 runs by itself.">
  <style>
    .lab { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9198a1; }
    .t { font: 500 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .s { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9198a1; }
    .m { font: 500 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f6fc; }
    .ms { font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #9198a1; }
    .k { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f6fc; }
    .a { fill: #d4a72c; font-weight: 700; }
    .f { fill: #656c76; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#656c76"/>
    </marker>
  </defs>
  <text x="0" y="75" class="lab">Claude</text><line x1="132" y1="70" x2="880" y2="70" stroke="#3d444d" stroke-dasharray="2 4"/>
  <text x="0" y="145" class="lab">You</text><line x1="132" y1="140" x2="880" y2="140" stroke="#3d444d" stroke-dasharray="2 4"/>
  <text x="0" y="215" class="lab">The line above</text><line x1="132" y1="210" x2="880" y2="210" stroke="#3d444d" stroke-dasharray="2 4"/>
  <rect x="132" y="56" width="168" height="28" rx="6" fill="#0c2d6b" stroke="#1f6feb"/><text x="216.0" y="75" class="t" text-anchor="middle">step 2 asks for a yes</text>
  <rect x="420" y="56" width="200" height="28" rx="6" fill="#0c2d6b" stroke="#1f6feb"/><text x="520.0" y="75" class="t" text-anchor="middle">step 2 builds it</text>
  <rect x="640" y="56" width="240" height="28" rx="6" fill="#0c2d6b" stroke="#1f6feb"/><text x="760.0" y="75" class="t" text-anchor="middle">step 3, by itself</text>
  <path d="M620 70 H636" stroke="#656c76" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="304" y="126" width="112" height="28" rx="14" fill="#151b23" stroke="#3d444d"/><text x="360.0" text-anchor="middle" y="145" class="m">yes, build it</text>
  <path d="M360 124 V90" stroke="#656c76" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="132.5" y="196" width="747" height="28" rx="6" fill="#2b2100" stroke="#bb8009"/>
  <line x1="300" y1="200" x2="300" y2="220" stroke="#bb8009"/>
  <line x1="420" y1="200" x2="420" y2="220" stroke="#bb8009"/>
  <line x1="620" y1="200" x2="620" y2="220" stroke="#bb8009"/>
  <text x="216" y="214" class="ms" text-anchor="middle">step 2 running</text>
  <text x="360" y="214" class="ms" text-anchor="middle">waits for you</text>
  <text x="520" y="214" class="ms" text-anchor="middle">step 2 running</text>
  <text x="760" y="214" class="ms" text-anchor="middle">step 3 running</text>
</svg>
