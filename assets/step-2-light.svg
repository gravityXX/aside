    .a { fill: #9a6700; font-weight: 700; }
    .k { fill: #1a7f37; }
    .b { font-weight: 700; }
    .claude { fill: #c15f3c; font-weight: 700; }
    .kidea { fill: #5769f7; }
    .kquestion { fill: #966c1e; }
    .t { font: 600 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .key { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
  </style>
  <rect x="0.5" y="0.5" width="879" height="151" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <path d="M0.5 32 V10.5 a10 10 0 0 1 10 -10 H869.5 a10 10 0 0 1 10 10 V32 Z" fill="#eef1f4"/>
  <line x1="0.5" y1="32" x2="879.5" y2="32" stroke="#d1d9e0"/>
  <circle cx="18" cy="16.5" r="4.5" fill="#d1d9e0"/><circle cx="33" cy="16.5" r="4.5" fill="#d1d9e0"/><circle cx="48" cy="16.5" r="4.5" fill="#d1d9e0"/>
  <text x="440.0" y="21" class="t" text-anchor="middle">Claude Code</text>
  <text x="24" y="56" class="m"><tspan class="a">● </tspan>Done. Shall I update the docs too?</text>
  <rect x="16" y="70" width="848" height="30" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="24" y="90" class="m d">aside: 1 idea, 4 comments</text>
  <rect x="764" y="75" width="84" height="20" rx="4" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="806" y="89" class="m" text-anchor="middle">organize</text>
  <text x="24" y="126" class="m"><tspan class="f">❯ </tspan>yes, go ahead</text><text x="380" y="126" class="m d">your reply goes to Claude as usual</text>

