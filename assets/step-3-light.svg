  <text x="440.0" y="21" class="t" text-anchor="middle">Claude Code</text>
  <text x="24" y="56" class="m"><tspan class="f">❯ </tspan><tspan class="a">/aside</tspan></text><text x="380" y="56" class="m d">see the list</text>
  <text x="40" y="82" class="m f">⎿</text><text x="64" y="82" class="m">1 idea and 1 comment waiting</text>
  <text x="80" y="121.0" class="m" text-anchor="end">1</text><text x="100" y="121.0" class="m">idea</text><text x="200" y="121.0" class="m">cache the parsed config</text>
  <text x="80" y="147.0" class="m" text-anchor="end">2</text><text x="100" y="147.0" class="m">question</text><text x="200" y="147.0" class="m">where is this from</text>
