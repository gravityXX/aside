    .key { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
  </style>
  <rect x="0.5" y="0.5" width="879" height="289" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
