<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="880" height="280" viewBox="0 0 880 280" role="img" aria-label="While Claude works on your task, you copy text with Ctrl+C and add ideas and comments; they go to a queue instead of to Claude. When it is done you answer it as usual, and /aside plan hands the queue over as steps, which Claude sums up after the last one.">
  <style>
    .lab { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9198a1; }
    .t { font: 500 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .s { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9198a1; }
    .m { font: 500 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f6fc; }
    .k { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f6fc; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#656c76"/>
    </marker>
  </defs>

  <text x="0" y="75" class="lab">Claude</text>
  <text x="0" y="165" class="lab">You</text>
  <text x="0" y="235" class="lab">Queue</text>
  <line x1="92" y1="70" x2="880" y2="70" stroke="#3d444d" stroke-dasharray="2 4"/>
  <line x1="92" y1="160" x2="880" y2="160" stroke="#3d444d" stroke-dasharray="2 4"/>

  <rect x="92" y="56" width="420" height="28" rx="6" fill="#0c2d6b" stroke="#1f6feb"/>
  <text x="106" y="75" class="t">works on your task, undisturbed</text>
  <rect x="524" y="56" width="56" height="28" rx="14" fill="#151b23" stroke="#3d444d"/><text x="552" y="75" class="t" text-anchor="middle">done</text>

  <rect x="96" y="146" width="96" height="28" rx="14" fill="#3b2e00" stroke="#bb8009"/><text x="144" y="165" class="m" text-anchor="middle">+ idea</text>
  <text x="240" y="136" class="s" text-anchor="middle">copy first</text>
  <rect x="208" y="147" width="64" height="26" rx="5" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
  <rect x="209" y="168" width="62" height="4" rx="2" fill="#3d444d"/>
  <text x="240" y="164" class="k" text-anchor="middle">Ctrl+C</text>
  <path d="M274 160 H284" stroke="#d4a72c" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="288" y="146" width="112" height="28" rx="14" fill="#3b2e00" stroke="#bb8009"/><text x="344" y="165" class="m" text-anchor="middle">+? comment</text>
  <rect x="416" y="146" width="104" height="28" rx="14" fill="#3b2e00" stroke="#bb8009"/><text x="468" y="165" class="m" text-anchor="middle">+! change</text>

  <path d="M144 176 V212" stroke="#bb8009" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M344 176 V212" stroke="#bb8009" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M468 176 V212" stroke="#bb8009" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="92" y="216" width="440" height="28" rx="6" fill="#151b23" stroke="#bb8009" stroke-dasharray="4 3"/>
  <text x="106" y="235" class="s">waits here with what you copied, Claude does not see it</text>

  <rect x="548" y="146" width="52" height="28" rx="14" fill="#151b23" stroke="#3d444d"/><text x="574" y="165" class="t" text-anchor="middle">reply</text>
  <path d="M574 144 V90" stroke="#656c76" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <rect x="616" y="146" width="112" height="28" rx="14" fill="#0f2d1a" stroke="#2ea043"/><text x="672" y="165" class="m" text-anchor="middle">/aside plan</text>
  <path d="M536 230 H672 V180" stroke="#2ea043" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M672 144 V90" stroke="#2ea043" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <rect x="624" y="56" width="72" height="28" rx="14" fill="#0f2d1a" stroke="#2ea043"/><text x="660" y="75" class="t" text-anchor="middle">step 1</text>
  <rect x="704" y="56" width="72" height="28" rx="14" fill="#0f2d1a" stroke="#2ea043"/><text x="740" y="75" class="t" text-anchor="middle">step 2</text>
  <rect x="784" y="56" width="96" height="28" rx="14" fill="#0f2d1a" stroke="#2ea043"/><text x="832" y="75" class="t" text-anchor="middle">summary</text>

  <text x="574" y="272" class="s" text-anchor="middle">you answer as usual</text>
  <text x="792" y="272" class="s" text-anchor="middle">then hand the queue over</text>
</svg>
