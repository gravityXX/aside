<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="880" height="252" viewBox="0 0 880 252" role="img" aria-label="While Claude builds the parser, you type + dark mode and press Enter: it never reaches Claude, and a line in the transcript says it is queued, 1 waiting. A draft that ends with + is queued whole too, 2 waiting, and the line above the prompt counts 2 ideas, with a list button.">
  <style>
    .m { font: 400 13.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .d { fill: #59636e; }
    .f { fill: #818b98; }
    .a { fill: #9a6700; font-weight: 700; }
    .k { fill: #1a7f37; }
    .b { font-weight: 700; }
    .claude { fill: #c15f3c; font-weight: 700; }
    .kidea { fill: #5769f7; }
    .kquestion { fill: #966c1e; }
    .t { font: 600 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .key { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
  </style>
  <rect x="0.5" y="0.5" width="879" height="251" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <path d="M0.5 32 V10.5 a10 10 0 0 1 10 -10 H869.5 a10 10 0 0 1 10 10 V32 Z" fill="#eef1f4"/>
  <line x1="0.5" y1="32" x2="879.5" y2="32" stroke="#d1d9e0"/>
  <circle cx="18" cy="16.5" r="4.5" fill="#d1d9e0"/><circle cx="33" cy="16.5" r="4.5" fill="#d1d9e0"/><circle cx="48" cy="16.5" r="4.5" fill="#d1d9e0"/>
  <text x="440.0" y="21" class="t" text-anchor="middle">Claude Code</text>
  <text x="24" y="56" class="m"><tspan class="a">● </tspan>Building the parser…</text><text x="380" y="56" class="m d">Claude works</text>
  <text x="24" y="95.0" class="m"><tspan class="f">❯ </tspan><tspan class="a">+</tspan> dark mode</text><text x="380" y="95.0" class="m d">Enter: it never reaches Claude</text>
  <text x="24" y="121.0" class="m"><tspan class="k">queued &quot;dark mode&quot; · 1 waiting</tspan></text><text x="380" y="121.0" class="m d">a line in the transcript</text>
  <text x="24" y="160.0" class="m"><tspan class="f">❯ </tspan>make the errors friendlier <tspan class="a">+</tspan></text><text x="380" y="160.0" class="m d">a draft ending with + too</text>
  <text x="24" y="186.0" class="m"><tspan class="k">queued &quot;make the errors friendlier&quot; · 2 waiting</tspan></text>
  <rect x="16" y="202.0" width="848" height="30" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="24" y="222.0" class="m d">aside: 2 ideas · </text>
  <rect x="796" y="207.0" width="52" height="20" rx="4" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="822" y="221.0" class="m" text-anchor="middle">list</text>

