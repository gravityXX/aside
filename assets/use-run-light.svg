<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="880" height="186" viewBox="0 0 880 186" role="img" aria-label="/aside run all sends the steps to Claude one after another: step 1, step 2 and step 3, each reply ending with a Result line, such as config cached, which the plan keeps. The last step's reply ends with a summary of the run: what was done, what is open and what comes next.">
  <style>
    .lab { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .t { font: 500 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .s { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .m { font: 500 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .ms { font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
    .k { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .a { fill: #9a6700; font-weight: 700; }
    .f { fill: #818b98; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#818b98"/>
    </marker>
  </defs>
  <text x="0" y="75" class="lab">Claude</text><line x1="92" y1="70" x2="880" y2="70" stroke="#d1d9e0" stroke-dasharray="2 4"/>
  <text x="0" y="165" class="lab">You</text><line x1="92" y1="160" x2="880" y2="160" stroke="#d1d9e0" stroke-dasharray="2 4"/>
  <rect x="240" y="56" width="150" height="28" rx="6" fill="#ddf4ff" stroke="#54aeff"/><text x="315.0" y="75" class="t" text-anchor="middle">step 1</text>
  <text x="315.0" y="106" class="ms" text-anchor="middle">Result: config cached</text>
  <rect x="404" y="56" width="150" height="28" rx="6" fill="#ddf4ff" stroke="#54aeff"/><text x="479.0" y="75" class="t" text-anchor="middle">step 2</text>
  <text x="479.0" y="106" class="ms" text-anchor="middle">Result: why it was slow</text>
  <rect x="568" y="56" width="240" height="28" rx="6" fill="#ddf4ff" stroke="#54aeff"/><text x="688.0" y="75" class="t" text-anchor="middle">step 3, then the summary</text>
  <text x="688.0" y="106" class="ms" text-anchor="middle">Result, then done, open and next</text>
  <path d="M392 70 H400" stroke="#818b98" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M556 70 H564" stroke="#818b98" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="88" y="146" width="136" height="28" rx="14" fill="#dafbe1" stroke="#4ac26b"/><text x="156.0" text-anchor="middle" y="165" class="m">/aside run all</text>
  <path d="M156 144 V70 H236" stroke="#4ac26b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="240" y="165" class="s">one step at a time; each reply ends with a result the plan keeps</text>
</svg>
