    .a { fill: #d4a72c; font-weight: 700; }
    .k { fill: #3fb950; }
    .b { font-weight: 700; }
    .claude { fill: #d77757; font-weight: 700; }
    .kidea { fill: #b1b9f9; }
    .kquestion { fill: #ffc107; }
    .t { font: 600 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9198a1; }
    .key { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f6fc; }
  </style>
  <rect x="0.5" y="0.5" width="879" height="151" rx="10" fill="#151b23" stroke="#3d444d"/>
  <path d="M0.5 32 V10.5 a10 10 0 0 1 10 -10 H869.5 a10 10 0 0 1 10 10 V32 Z" fill="#1c232c"/>
  <line x1="0.5" y1="32" x2="879.5" y2="32" stroke="#3d444d"/>
  <circle cx="18" cy="16.5" r="4.5" fill="#3d444d"/><circle cx="33" cy="16.5" r="4.5" fill="#3d444d"/><circle cx="48" cy="16.5" r="4.5" fill="#3d444d"/>
  <text x="440.0" y="21" class="t" text-anchor="middle">Claude Code</text>
  <text x="24" y="56" class="m"><tspan class="a">● </tspan>Done. Shall I update the docs too?</text>
  <rect x="16" y="70" width="848" height="30" rx="6" fill="#2b2100" stroke="#bb8009"/>
  <text x="24" y="90" class="m d">aside: 1 idea, 4 comments</text>
  <rect x="764" y="75" width="84" height="20" rx="4" fill="#0d1117" stroke="#3d444d"/>
  <text x="806" y="89" class="m" text-anchor="middle">organize</text>
  <text x="24" y="126" class="m"><tspan class="f">❯ </tspan>yes, go ahead</text><text x="380" y="126" class="m d">your reply goes to Claude as usual</text>

