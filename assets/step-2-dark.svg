<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="880" height="152" viewBox="0 0 880 152" role="img" aria-label="Claude finishes and asks whether to update the docs. Above the prompt, a line shows the queue, aside: 1 idea, 4 comments, with an organize button. You answer yes, go ahead, which goes to Claude as usual; the queue keeps waiting.">
