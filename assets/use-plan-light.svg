<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="880" height="232" viewBox="0 0 880 232" role="img" aria-label="/aside plan hands the queue to Claude: + dark mode, +? why so slow and + fix the login bug. Claude organizes them into steps and saves the plan, step 1 dark mode and step 2 why so slow, shown in a frame; the unclear login bug goes back to the queue as it was, and Claude's question about it shows under the plan.">
  <style>
    .lab { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .t { font: 500 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .s { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .m { font: 500 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .ms { font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
    .k { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .a { fill: #9a6700; font-weight: 700; }
    .f { fill: #818b98; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#818b98"/>
    </marker>
  </defs>
  <text x="0" y="40" class="lab">Queue</text><text x="610" y="40" class="lab">Plan</text>
  <rect x="0.5" y="52" width="250" height="132" rx="8" fill="#f6f8fa" stroke="#d4a72c" stroke-dasharray="4 3"/>
  <rect x="16" y="66" width="218" height="28" rx="14" fill="#fff8c5" stroke="#d4a72c"/><text x="125.0" text-anchor="middle" y="85" class="m"><tspan class="a">+</tspan> dark mode</text>
  <rect x="16" y="104" width="218" height="28" rx="14" fill="#fff8c5" stroke="#d4a72c"/><text x="125.0" text-anchor="middle" y="123" class="m"><tspan class="a">+?</tspan> why so slow</text>
  <rect x="16" y="142" width="218" height="28" rx="14" fill="#fff8c5" stroke="#d4a72c"/><text x="125.0" text-anchor="middle" y="161" class="m"><tspan class="a">+</tspan> fix the login bug</text>
  <rect x="362" y="52" width="136" height="28" rx="14" fill="#dafbe1" stroke="#4ac26b"/><text x="430.0" text-anchor="middle" y="71" class="m">/aside plan</text>
  <path d="M430 82 V100" stroke="#4ac26b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="300" y="104" width="260" height="28" rx="6" fill="#ddf4ff" stroke="#54aeff"/><text x="430.0" y="123" class="t" text-anchor="middle">Claude organizes them into steps</text>
  <path d="M254 118 H296" stroke="#d4a72c" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M564 118 H606" stroke="#4ac26b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="610.5" y="52" width="269" height="94" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <rect x="626" y="66" width="238" height="28" rx="14" fill="#dafbe1" stroke="#4ac26b"/><text x="745.0" text-anchor="middle" y="85" class="m">step 1  dark mode</text>
  <rect x="626" y="104" width="238" height="28" rx="14" fill="#dafbe1" stroke="#4ac26b"/><text x="745.0" text-anchor="middle" y="123" class="m">step 2  why so slow</text>
  <path d="M430 134 V216 H125 V188" stroke="#d4a72c" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="440" y="208" class="s">unclear: back in the queue, its question under the plan</text>
  <text x="745" y="168" class="s" text-anchor="middle">shown in a frame</text>
</svg>
