<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="880" height="355" viewBox="0 0 880 355" role="img" aria-label="In Claude Code: /aside plan has Claude save the queue as steps, and /aside run all sends them one after another. Above the prompt, aside: step 2/3 running, 1 idea, with list and stop buttons. The list shows the plan: step 1 done with its result under it, cached once at start-up; the tests pass, step 2 running, step 3 to do. After the last step, Claude ends with a summary of the run: what was done, what is open and what comes next.">
  <style>
    .m { font: 400 13.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f6fc; }
    .d { fill: #9198a1; }
    .f { fill: #656c76; }
    .a { fill: #d4a72c; font-weight: 700; }
    .k { fill: #3fb950; }
    .b { font-weight: 700; }
    .claude { fill: #d77757; font-weight: 700; }
    .kidea { fill: #b1b9f9; }
    .kquestion { fill: #ffc107; }
    .t { font: 600 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9198a1; }
    .key { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f6fc; }
  </style>
  <rect x="0.5" y="0.5" width="879" height="354" rx="10" fill="#151b23" stroke="#3d444d"/>
  <path d="M0.5 32 V10.5 a10 10 0 0 1 10 -10 H869.5 a10 10 0 0 1 10 10 V32 Z" fill="#1c232c"/>
  <line x1="0.5" y1="32" x2="879.5" y2="32" stroke="#3d444d"/>
  <circle cx="18" cy="16.5" r="4.5" fill="#3d444d"/><circle cx="33" cy="16.5" r="4.5" fill="#3d444d"/><circle cx="48" cy="16.5" r="4.5" fill="#3d444d"/>
  <text x="440.0" y="21" class="t" text-anchor="middle">Claude Code</text>
  <text x="24" y="56" class="m"><tspan class="f">❯ </tspan><tspan class="a">/aside plan</tspan></text><text x="380" y="56" class="m d">Claude saves the queue as steps</text>
  <text x="24" y="82" class="m"><tspan class="f">❯ </tspan><tspan class="a">/aside run all</tspan></text><text x="380" y="82" class="m d">they go one after another</text>
  <rect x="16" y="96" width="848" height="30" rx="6" fill="#2b2100" stroke="#bb8009"/>
  <text x="24" y="116" class="m d">aside: step 2/3 running, 1 idea</text>
  <rect x="796" y="101" width="52" height="20" rx="4" fill="#0d1117" stroke="#3d444d"/>
  <text x="822" y="115" class="m" text-anchor="middle">stop</text>
  <rect x="736" y="101" width="52" height="20" rx="4" fill="#0d1117" stroke="#3d444d"/>
  <text x="762" y="115" class="m" text-anchor="middle">list</text>
  <text x="48" y="166" class="m claude">aside</text><text x="108" y="166" class="m b">Plan: 2 of 3 steps to do (/aside run)</text>
  <text x="64" y="205.0" class="m d" text-anchor="end">1</text><text x="84" y="205.0" class="m k">done</text><text x="168" y="205.0" class="m d">cache the parsed config</text>
  <text x="168" y="231.0" class="m d">↳ cached once at start-up; the tests pass</text>
  <text x="64" y="257.0" class="m d" text-anchor="end">2</text><text x="84" y="257.0" class="m kquestion">running</text><text x="168" y="257.0" class="m">where is this from</text>
  <text x="64" y="283.0" class="m d" text-anchor="end">3</text><text x="84" y="283.0" class="m ">to do</text><text x="168" y="283.0" class="m">a shorter results section</text>
  <rect x="32" y="140" width="824" height="157.0" rx="8" fill="none" stroke="#3d444d" stroke-width="1.5"/>
  <text x="24" y="329.5" class="m"><tspan class="a">● </tspan><tspan class="b">Summary of the run</tspan></text><text x="380" y="329.5" class="m d">after the last step: done, open, next</text>

</svg>
