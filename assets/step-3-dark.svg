  <circle cx="18" cy="16.5" r="4.5" fill="#3d444d"/><circle cx="33" cy="16.5" r="4.5" fill="#3d444d"/><circle cx="48" cy="16.5" r="4.5" fill="#3d444d"/>
  <text x="440.0" y="21" class="t" text-anchor="middle">Claude Code</text>
  <text x="24" y="56" class="m"><tspan class="f">❯ </tspan><tspan class="a">/aside</tspan></text><text x="380" y="56" class="m d">see the list</text>
  <text x="48" y="94" class="m claude">aside</text><text x="108" y="94" class="m b">1 idea and 1 comment waiting</text>
  <text x="64" y="133.0" class="m d" text-anchor="end">1</text><text x="84" y="133.0" class="m kidea">idea</text><text x="168" y="133.0" class="m">cache the parsed config</text>
  <text x="64" y="159.0" class="m d" text-anchor="end">2</text><text x="84" y="159.0" class="m kquestion">question</text><text x="168" y="159.0" class="m">where is this from</text>
  <text x="168" y="185.0" class="m d">↳ docs/report.md:42 · &quot;Revenue grew by 12% in Q3.&quot;</text>
