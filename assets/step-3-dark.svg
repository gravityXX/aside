<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="880" height="309" viewBox="0 0 880 309" role="img" aria-label="In Claude Code: /aside draws what waits in a frame, 1 idea and 1 comment, in columns: number, kind in its colour, text, and under a comment its file, line and quote. /aside plan has Claude turn it into steps; /aside run runs them, step 1 of 3 first; /aside pop 2 puts entry 2 in the prompt box, ready to send.">
