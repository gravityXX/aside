  <text x="24" y="257.5" class="m"><tspan class="f">❯ </tspan><tspan class="a">/aside run</tspan></text><text x="380" y="257.5" class="m d">step 1 of 3 running</text>
  <text x="24" y="283.5" class="m"><tspan class="f">❯ </tspan><tspan class="a">/aside pop 2</tspan></text><text x="380" y="283.5" class="m d">entry 2, ready to send</text>

